name: build
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn compile
      - run: yarn test
      - run: npm pack --dry-run
